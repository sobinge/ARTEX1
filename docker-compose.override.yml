# 本地从源码构建并叠加 tor（见 Dockerfile.tor / rebuild-local.sh）。
# 发布端口只做端口映射，来源限制交给宿主机防火墙（Docker 发布端口会绕过 ufw）。
services:
  postgres:
    networks:
      default:
        # 固定 IP：artex 的 /etc/resolv.conf 已指向 Tor（127.0.0.1:53），
        # 容器名 postgres 改由 extra_hosts 提供，不再经过 Docker 内嵌 DNS。
        ipv4_address: 172.18.0.3
  artex:
    image: artex-tor:local
    build:
      context: .
      dockerfile: Dockerfile.tor
    extra_hosts:
      - "postgres:172.18.0.3"
      # 系统 DNS 走 Tor；Tor 自身连接宿主机上游时使用固定 hosts 解析。
      - "host.docker.internal:host-gateway"
      # 大模型端点固定解析：容器内 DNS 已全部走 Tor，而 Tor DNS 对部分域名
      # 会 SERVERFAIL；这里用 /etc/hosts 固定 IP，配合下面的直连白名单使用。
      # 换 IP 时改 .env 的 ARTEX_LLM_IP（或直接改此处）。
      - "api.deepseek.com:${ARTEX_LLM_IP:-3.173.21.63}"
    environment:
      # 逗号/空格分隔的直连目标 IP（大模型、第三方情报 API 等），其余流量强制 Tor
      ARTEX_DIRECT_IPS: "${ARTEX_LLM_IP:-3.173.21.63}"
      # 首次启动写入数据库，后续保留 UI 中已保存的策略。
      ARTEX_TOR_POOL_ENABLED: "${ARTEX_TOR_POOL_ENABLED:-true}"
      ARTEX_TOR_POOL_SIZE: "${ARTEX_TOR_POOL_SIZE:-5}"
      ARTEX_TOR_POOL_DIR: /var/lib/artex-tor
      ARTEX_TOR_POOL_BINARY: /usr/sbin/tor
      ARTEX_TOR_POOL_UPSTREAM: "${ARTEX_TOR_POOL_UPSTREAM:-}"
      ARTEX_TOR_BRIDGES_FILE: /etc/tor/artex-bridges.torrc
      ARTEX_CLASH_ENABLED: "${ARTEX_CLASH_ENABLED:-0}"
      ARTEX_CLASH_DIR: /var/lib/artex-clash
      # 仅初始化尚无节点配置的部署；保存的订阅节点优先。
      ARTEX_CLASH_UPSTREAM: "${ARTEX_CLASH_UPSTREAM:-}"
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/artex-tor-healthcheck.py"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 180s
    # 入口脚本要在容器 netns 里装 DNS 重定向规则（见 deploy/artex-entry.sh）
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    ports: !override
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      # Tor 状态/控制口 cookie 独立持久化，不放入可浏览的工作区 data/。
      - torstate:/var/lib/artex-tor
      # 节点凭据/控制口密钥不放入可浏览的工作区 data/。
      - clashstate:/var/lib/artex-clash
      - type: bind
        source: ${ARTEX_TOR_BRIDGES_CONFIG:-./deploy/tor-bridges.conf}
        target: /etc/tor/artex-bridges.torrc
        read_only: true
        bind:
          create_host_path: false
      # JWT 签名密钥持久化，避免容器重建后所有人被登出。
      - type: bind
        source: ./jwt.key
        target: /app/jwt.key
        bind:
          create_host_path: false
      # DNS 重定向到 slot1 的 DNSPort 19053（见 deploy/artex-entry.sh + tor-shim.sh）
      - ./deploy/resolv.conf:/etc/resolv.conf:ro
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
volumes:
  torstate:
  clashstate:
