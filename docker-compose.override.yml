# 本地从源码构建并叠加 tor（见 Dockerfile.tor / rebuild-local.sh）。
# 发布端口只做端口映射，来源限制交给宿主机防火墙（Docker 发布端口会绕过 ufw）。
services:
  postgres:
    networks:
      default:
        # 固定 IP：artex 的 /etc/resolv.conf 已指向 Tor（127.0.0.1:53），
        # 容器名 postgres 改由 extra_hosts 提供，不再经过 Docker 内嵌 DNS。
        ipv4_address: 172.18.0.3
  artex:
    image: artex-tor:local
    build:
      context: .
      dockerfile: Dockerfile.tor
    extra_hosts:
      - "postgres:172.18.0.3"
      # 大模型端点固定解析：容器内 DNS 已全部走 Tor，而 Tor DNS 对部分域名
      # 会 SERVERFAIL；这里用 /etc/hosts 固定 IP，配合下面的直连白名单使用。
      # 换 IP 时改 .env 的 ARTEX_LLM_IP（或直接改此处）。
      - "api.deepseek.com:${ARTEX_LLM_IP:-3.173.21.63}"
    environment:
      # 逗号/空格分隔的直连目标 IP（大模型、第三方情报 API 等），其余流量强制 Tor
      ARTEX_DIRECT_IPS: "${ARTEX_LLM_IP:-3.173.21.63}"
    # 入口脚本要在容器 netns 里装 DNS 重定向规则（见 deploy/artex-entry.sh）
    cap_add:
      - NET_ADMIN
    ports: !override
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # JWT 签名密钥持久化，避免容器重建后所有人被登出。
      - ./data/jwt.key:/app/jwt.key
      # DNS 重定向到 slot1 的 DNSPort 19053（见 deploy/artex-entry.sh + tor-shim.sh）
      - ./deploy/resolv.conf:/etc/resolv.conf:ro
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
